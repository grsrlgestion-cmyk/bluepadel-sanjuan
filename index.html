<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blue Padel San Juan</title>
<style>
html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#071873;color:white}
#loading{min-height:100vh;display:grid;place-items:center;text-align:center;padding:30px}
#loading b{font-size:28px}.dot{color:#a7d832}
</style>
</head>
<body>
<div id="loading"><div><b>BLUE PADEL <span class="dot">●</span></b><br><br>Cargando turnero...</div></div>
<script>
(async()=>{
  try{
    const parts=["parts/blue_padel_01.txt","parts/blue_padel_02.txt","parts/blue_padel_03.txt","parts/blue_padel_04.txt","parts/blue_padel_05.txt","parts/blue_padel_06.txt","parts/blue_padel_07.txt","parts/blue_padel_08.txt","parts/blue_padel_09.txt","parts/blue_padel_10.txt"];
    const texts=await Promise.all(parts.map(async p=>{
      const r=await fetch(p,{cache:'no-store'});
      if(!r.ok) throw new Error('No se pudo cargar '+p);
      return r.text();
    }));
    document.open();
    document.write(texts.join(''));
    document.close();
  }catch(e){
    document.getElementById('loading').innerHTML='<div><b>BLUE PADEL</b><br><br>No se pudo cargar el turnero.<br>Actualizá la página.</div>';
    console.error(e);
  }
})();
</script>
</body>
</html>
